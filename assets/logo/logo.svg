<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .bg { fill: #121212; }
      .accent { fill: none; stroke: #ccff00; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .white { fill: none; stroke: #ffffff; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .text-home { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
      .text-workout { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ccff00; }
    </style>
  </defs>
  <!-- Tło nawiązujące do interfejsu aplikacji -->
  <rect width="500" height="500" class="bg" rx="90"/>
  
  <!-- Dach (Nawiązanie do Home) -->
  <path d="M 100 190 L 250 80 L 400 190" class="accent"/>
  <!-- Ściany i podłoga -->
  <path d="M 140 160 L 140 320 L 360 320 L 360 160" class="white"/>
  
  <!-- Hantel (Nawiązanie do Workout) -->
  <line x1="210" y1="230" x2="290" y2="230" class="accent"/>
  <line x1="210" y1="180" x2="210" y2="280" class="accent"/>
  <line x1="290" y1="180" x2="290" y2="280" class="accent"/>
  <line x1="175" y1="200" x2="175" y2="260" class="accent"/>
  <line x1="325" y1="200" x2="325" y2="260" class="accent"/>

  <!-- Tekst z nazwą aplikacji -->
  <text x="250" y="430" text-anchor="middle">
    <tspan class="text-home">Home</tspan><tspan class="text-workout">Workout</tspan>
  </text>
</svg>
