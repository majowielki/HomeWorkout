name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Generate typed routes
        run: npm run routes:types

      - name: Typecheck
        run: npm run typecheck

      - name: Validate exercise catalogue
        run: npm run validate:data

      - name: Test domain rules with coverage
        run: npm run test:coverage

      # Replays the evaluation cases through the whole pipeline with the rule-based
      # stand-in for the model. No key, no network. It proves the pipeline and the
      # scorers; it says nothing about any model. A safety scorer failing fails the build.
      - name: Evaluate (replay)
        run: npm run eval

      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evals/reports/
          if-no-files-found: ignore

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (generates the binding types first)
        run: npm run typecheck

      - name: Test in workerd (mock model, no key, no network)
        run: npm test

      - name: Bundle as a deploy would
        run: npm run build:dry

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Worker holds a provider key and the app holds a shared secret; neither
      # may ever be committed. Fails the build if anything in history looks like one.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
